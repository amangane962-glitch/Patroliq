name: patrol_iq_mobile
description: "PatrolIQ - Security Patrol and Asset Inspection Mobile Client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase Client Integration
  supabase_flutter: ^2.6.0

  # Local Caching & Sync Queue (NoSQL Key-Value Store)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Device Hardware Capabilities
  geolocator: ^11.0.0        # GPS coordinates capture
  mobile_scanner: ^5.1.1     # QR & NFC scan camera interface
  connectivity_plus: ^6.0.3  # Internet state listener for sync queue
  
  # Media Recording and Selection
  image_picker: ^1.1.2       # Photo capture from camera
  record: ^5.1.2             # Audio recorder for voice memos
  path_provider: ^2.1.3      # File system directory locator

  # Utilities
  uuid: ^4.4.0               # Client-generated collision-free IDs
  intl: ^0.19.0              # Date formatting helpers

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
